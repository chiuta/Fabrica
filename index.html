  /* ---------- confirmare (dialog propriu, nu window.confirm) ---------- */

      var no = doc.createElement('button'); no.type = 'button'; no.className = 'fff-btn'; no.textContent = opt.no || T('no');
      var yes = doc.createElement('button'); yes.type = 'button'; yes.className = 'fff-btn fff-primary' + (opt.danger ? ' fff-danger' : ''); yes.textContent = opt.yes || T('yes');

  function ask(msg, c, o) {

  /* ---------- construire ---------- */
  var redactors = [];

  function encrypt(obj, password) {

  function validatePlain(o, slug) {

  /* ---------- API ---------- */
  var bundle = F.bundle = {

    /** Înregistrează fn(cheie, valoare) -> valoare curățată (șir); se aplică doar exportului necriptat. */
    redact: function (fn) { if (typeof fn === 'function') redactors.push(fn); },
    confirm: confirmDlg,

    /** Descarcă un .fff.json. Cu {encrypt:true, password} produce varianta criptată. */
    export: function (opt) {

    import: function (file, opt) {

      return readText(file).then(function (t) {
        var o = parseEnvelope(t);
        if (o.app !== slug) throw BErr('app', {got: o.app, want: slug});
        if (o.format === 'fff-bundle-enc') {
          if (opt.password == null || opt.password === '') throw BErr('password_required', {file: fname});
          return decrypt(o, opt.password).then(function (p) {
            if (p.app !== o.app) throw BErr('format');

          });
        }

      }).then(function (o) {
        var keys = validatePlain(o, slug);
        return ask(T('confirm_import', {n: keys.length, app: slug, ver: o.version || '?', date: (o.exported || '').slice(0, 10) || '?'}), opt.confirm)
          .then(function (ok) {
            if (!ok) return {keys: 0, cancelled: true};
            var undo = {};
            try {
              keys.forEach(function (k) {
                if (!(k in undo)) undo[k] = F.store.raw.get(k);
                F.store.raw.set(k, o.data[k]);

              });
            } catch (e) {
              Object.keys(undo).forEach(function (k) { try { if (undo[k] == null) F.store.raw.remove(k); else F.store.raw.set(k, undo[k]); } catch (e2) { /* ignorat */ } });

          });
      });
    },

    /** Șterge DOAR cheile indexate ale aplicației (și cele fff.<slug>.*). */
    wipe: function (opt) {

      if (!keys.length) return Promise.resolve({keys: 0, cancelled: false});
      return ask(T('confirm_wipe', {n: keys.length}), opt.confirm, {danger: true, yes: T('wipe_yes')}).then(function (ok) {

      });
    }
  };
})();

<script type="text/plain" id="player-css">:root{color-scheme:light;--bg:#f6f5f1;--panel:#ffffff;--sunk:#ebe9e2;--border:#c9ccc8;--text:#1c2124;--dim:#4d565c;--accent:#0a6560;--accent-fill:#0a6560;--accent-ink:#ffffff;--good:#1d6b34;--bad:#a82c22;--warn:#7a5a00;--good-bg:#e4f2e8;--bad-bg:#fbe9e7;--warn-bg:#fbf1d6;--radius:10px;--sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--serif:Georgia,"Iowan Old Style","Times New Roman",serif}
:root[data-accent="indigo"]{--accent:#3f4bb5;--accent-fill:#3f4bb5}
:root[data-accent="green"]{--accent:#2c6b2f;--accent-fill:#2c6b2f}
:root[data-accent="wine"]{--accent:#9a2547;--accent-fill:#9a2547}
:root[data-accent="amber"]{--accent:#8a4b00;--accent-fill:#8a4b00}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14181b;--panel:#1c2125;--sunk:#0f1214;--border:#374047;--text:#ebe9e3;--dim:#a5adb2;--accent:#4fc9bd;--accent-fill:#4fc9bd;--accent-ink:#0b0f10;--good:#6fd08a;--bad:#ff9d94;--warn:#e8bd52;--good-bg:#17301f;--bad-bg:#38201e;--warn-bg:#352c10}
:root[data-theme="dark"][data-accent="indigo"]{--accent:#9aa6ff;--accent-fill:#9aa6ff}
:root[data-theme="dark"][data-accent="green"]{--accent:#7bd07f;--accent-fill:#7bd07f}
:root[data-theme="dark"][data-accent="wine"]{--accent:#f08aa6;--accent-fill:#f08aa6}
:root[data-theme="dark"][data-accent="amber"]{--accent:#f0b45a;--accent-fill:#f0b45a}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 var(--sans)}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:8px;top:-80px;background:var(--accent-fill);color:var(--accent-ink);padding:8px 14px;border-radius:8px;z-index:60;font-weight:600}
.skip:focus{top:8px}
.bar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
.bar .ttl{font-weight:700;flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .prog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.bar .prog .track{width:90px;height:8px;border-radius:99px;background:var(--sunk);border:1px solid var(--border);overflow:hidden}
.bar .prog .fill{display:block;height:100%;background:var(--accent-fill);width:0}
.btn,button.btn,a.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:var(--panel);color:var(--text);cursor:pointer;text-decoration:none;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent-fill);border-color:var(--accent-fill);color:var(--accent-ink);font-weight:600}
.btn.sm{min-height:28px;padding:2px 10px;font-size:14px}
.btn[disabled]{opacity:.55;cursor:not-allowed}
select.btn{padding-right:8px}
.shell{display:block;max-width:1200px;margin:0 auto}
nav.side{display:none;padding:12px 14px;background:var(--panel);border-bottom:1px solid var(--border)}
nav.side.open{display:block}
nav.side ul{list-style:none;margin:0;padding:0}
nav.side .lv{margin:12px 0 4px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
nav.side a{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--text)}
nav.side a:hover{background:var(--sunk)}
nav.side a[aria-current="page"]{background:var(--sunk);box-shadow:inset 3px 0 0 var(--accent);font-weight:600}
nav.side .ck{width:1.2em;color:var(--good);flex:none;text-align:center}
nav.side .badge{margin-left:auto;font-size:12px;background:var(--accent-fill);color:var(--accent-ink);border-radius:99px;padding:0 8px}
main{padding:20px 16px 40px;max-width:820px;outline:none;min-width:0}
main h1{font-size:28px;line-height:1.2;margin:.2em 0 .4em;font-family:var(--serif)}
main h2{font-size:21px;margin:1.6em 0 .5em;line-height:1.3}
main h3{font-size:18px;margin:1.3em 0 .4em}
main h4{font-size:16px;margin:1.2em 0 .3em}
.lead{font-size:18px;color:var(--dim)}
.meta{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:14px 0;font-size:14px}
.meta dt{color:var(--dim)}.meta dd{margin:0;overflow-wrap:anywhere}
.card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:14px 0}
.disc{border-left:4px solid var(--warn);background:var(--warn-bg);padding:10px 14px;border-radius:6px;margin:12px 0;font-size:15px}
.disc strong{display:block}
.prose{overflow-wrap:break-word}
.prose img{max-width:100%;height:auto;border-radius:6px}
.prose blockquote{margin:1em 0;padding:.2em 1em;border-left:4px solid var(--accent);background:var(--sunk);border-radius:0 6px 6px 0}
.prose code{background:var(--sunk);padding:1px 5px;border-radius:4px;font-size:.92em}
.prose pre{background:var(--sunk);padding:12px;border-radius:8px;overflow:auto}
.prose hr{border:0;border-top:1px solid var(--border);margin:1.5em 0}
.tw{overflow-x:auto;margin:1em 0;max-width:100%}
.tw table,table.tbl{border-collapse:collapse;min-width:100%}
.tw th,.tw td,table.tbl th,table.tbl td{border:1px solid var(--border);padding:6px 10px;text-align:left;vertical-align:top}
.tw th,table.tbl th{background:var(--sunk)}
.evb{display:inline-block;font-size:12px;font-weight:600;padding:0 7px;border-radius:99px;border:1px solid currentColor;text-decoration:none;white-space:nowrap;vertical-align:baseline;margin:0 2px}
.ev-controlled{color:var(--good)}.ev-observational{color:var(--accent)}.ev-traditional{color:var(--warn)}.ev-none{color:var(--bad)}
dfn{font-style:normal;border-bottom:1px dotted var(--dim)}
dfn a{color:inherit;text-decoration:none}
.q{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin:14px 0}
.q fieldset{border:0;margin:0;padding:0;min-width:0}
.q legend{font-weight:600;padding:0;margin-bottom:8px;float:none;width:100%}
.q .hint{font-size:13px;color:var(--dim);margin:0 0 8px}
.q label.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 10px;border:1px solid var(--border);border-radius:8px;margin:6px 0;cursor:pointer}
.q label.opt input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--accent-fill)}
.q label.opt.ok{border-color:var(--good);background:var(--good-bg)}
.q label.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.q input[type=text],.q select,input.txt{min-height:36px;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg);max-width:100%}
.q input[type=text].ok{border-color:var(--good);background:var(--good-bg)}
.q input[type=text].no{border-color:var(--bad);background:var(--bad-bg)}
.q ol.ord{list-style:none;padding:0;margin:0}
.q ol.ord li{display:flex;gap:8px;align-items:center;padding:6px 8px;border:1px solid var(--border);border-radius:8px;margin:6px 0;background:var(--bg)}
.q ol.ord li .t{flex:1;min-width:0;overflow-wrap:anywhere}
.q ol.ord li.ok{border-color:var(--good);background:var(--good-bg)}.q ol.ord li.no{border-color:var(--bad);background:var(--bad-bg)}
.q .mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center;margin:6px 0}
.q .mrow.ok select{border-color:var(--good);background:var(--good-bg)}.q .mrow.no select{border-color:var(--bad);background:var(--bad-bg)}
.q .fb{margin-top:10px;padding:10px 12px;border-radius:8px;border-left:4px solid var(--border);background:var(--sunk)}
.q .fb.ok{border-left-color:var(--good)}.q .fb.no{border-left-color:var(--bad)}.q .fb.part{border-left-color:var(--warn)}
.q .fb .res{font-weight:700}
.q .fb.ok .res{color:var(--good)}.q .fb.no .res{color:var(--bad)}.q .fb.part .res{color:var(--warn)}
.q .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.pager{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin:28px 0 8px}
.sum{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;min-width:120px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat.ok b{color:var(--good)}.stat.no b{color:var(--bad)}
.cert{background:#fff;color:#1c2124;border:6px double #8a6d2b;padding:32px 24px;text-align:center;margin:18px 0;border-radius:4px}
.cert h2{font-family:var(--serif);font-size:30px;margin:0 0 10px;color:#1c2124}
.cert .nm{font-family:var(--serif);font-size:32px;border-bottom:1px solid #1c2124;display:inline-block;min-width:60%;padding:4px 12px;margin:14px 0;overflow-wrap:anywhere}
.cert p{margin:8px 0}.cert .fine{font-size:13px;color:#4d565c;margin-top:22px}
.field{display:block;margin:10px 0}
.field span{display:block;font-weight:600;margin-bottom:3px}
input.txt{width:100%;max-width:420px}
.foot{padding:16px;text-align:center;font-size:13px;color:var(--dim);border-top:1px solid var(--border);margin-top:20px}
.warn-box{background:var(--warn-bg);border:1px solid var(--warn);padding:8px 12px;border-radius:8px;font-size:14px;margin:10px 0}
.kbd{font-family:ui-monospace,monospace;background:var(--sunk);padding:1px 6px;border-radius:4px;border:1px solid var(--border)}
dl.gl dt{font-weight:700;margin-top:14px}dl.gl dd{margin:2px 0 0 0}
@media (min-width:900px){
 .shell{display:grid;grid-template-columns:280px minmax(0,1fr);align-items:start}
 nav.side{display:block;position:sticky;top:56px;max-height:calc(100vh - 56px);overflow:auto;border-bottom:0;border-right:1px solid var(--border);background:transparent;padding:16px 10px}
 #menuBtn{display:none}
 main{padding:28px 32px 60px}
}
@media (prefers-reduced-motion:no-preference){.bar .prog .fill{transition:width .3s}}
@media (max-width:420px){main{padding:16px 14px 32px}main h1{font-size:24px}.q .mrow{grid-template-columns:minmax(0,1fr)}.q select{width:100%}.cert .nm{min-width:90%}}
@media print{
 body{background:#fff;color:#000;font-size:11pt}
 .bar,nav.side,.skip,.pager,.acts,.noprint,.foot .noprint{display:none!important}
 .shell{display:block}main{max-width:none;padding:0}
 .q,.card,.disc{break-inside:avoid;border-color:#000;background:#fff}
 a{color:#000}
 body.print-cert main>*:not(.cert-wrap){display:none!important}
 body.print-cert .foot{display:none}
 .cert{border-color:#000}
}

  /* ---------- Markdown (subset) ---------- */
  var GLOS = [];
  function safeUrl(u) {

    if (/^mailto:[^\s]+$/i.test(u)) return {kind: 'ext', href: u};

    if (u === 'glossary:' || /^glossary:/.test(u)) return {kind: 'int', href: '#/glossary'};
    if (u === 'test:' || u === 'test') return {kind: 'int', href: '#/test'};

  }
  function safeImg(u) {
    u = String(u).replace(/&amp;/g, '&').trim();
    var am = u.match(/^img:([\w-]+)$/);
    if (am) u = (FP.D && FP.D.assets && FP.D.assets[am[1]]) || '';

  function inline(s) {

    });

    });
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>');
    s = s.replace(/(^|[\s(>])\*([^*\s][^*]*?)\*(?=[\s).,;:!?<]|$)/g, '$1<em>$2</em>').replace(/(^|[\s(>])_([^_\s][^_]*?)_(?=[\s).,;:!?<]|$)/g, '$1<em>$2</em>');
    s = s.replace(/\u0002(\d+)\u0002/g, function (_, i) { return '<code>' + esc(codes[+i]) + '</code>'; });
    return s;
  }
  function splitRow(line) {
    line = line.trim(); if (line[0] === '|') line = line.slice(1); if (line[line.length - 1] === '|') line = line.slice(0, -1);
    return line.split(/(?<!\\)\|/).map(function (c) { return c.replace(/\\\|/g, '|').trim(); });
  }
  function md(src, opts) {
    opts = opts || {}; var shift = opts.shift;
    if (shift == null) { var mn = 9, inFence = false; String(src).split('\n').forEach(function (ln) { if (/^```/.test(ln)) inFence = !inFence; var hm = !inFence && ln.match(/^(#{1,4})\s/); if (hm && hm[1].length < mn) mn = hm[1].length; }); shift = mn === 9 ? 1 : 2 - mn; }
    src = String(src == null ? '' : src).replace(/\r\n?/g, '\n');
    if (opts.inlineOnly) return inline(src.replace(/\n+/g, ' '));
    var lines = src.split('\n'), out = [], i = 0, tid = 0;
    function isBlank(l) { return /^\s*$/.test(l); }
    var listRe = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;
    while (i < lines.length) {

      if (isBlank(l)) { i++; continue; }
      var m;
      if (/^```/.test(l)) {
        var buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);

      }

        var lv = Math.min(6, m[1].length + shift); out.push('<h' + lv + '>' + inline(m[2]) + '</h' + lv + '>'); i++; continue;
      }
      if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)) { out.push('<hr>'); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ''));
        out.push('<blockquote>' + md(q.join('\n'), {shift: shift}) + '</blockquote>'); continue;
      }
      if (l.indexOf('|') >= 0 && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(lines[i + 1]) && lines[i + 1].indexOf('-') >= 0) {
        var head = splitRow(l), al = splitRow(lines[i + 1]).map(function (c) { return /^:-*:$/.test(c) ? 'center' : /-:$/.test(c) ? 'right' : ''; });
        i += 2; var rows = [];
        while (i < lines.length && lines[i].indexOf('|') >= 0 && !isBlank(lines[i])) rows.push(splitRow(lines[i++]));
        var h = '<div class="tw" tabindex="0" role="region" aria-label="' + esc(T('table')) + '"><table><thead><tr>';
        head.forEach(function (c, k) { h += '<th scope="col"' + (al[k] ? ' style="text-align:' + al[k] + '"' : '') + '>' + inline(c) + '</th>'; });
        h += '</tr></thead><tbody>';

          else items[items.length - 1].text += ' ' + lines[i].trim();
          i++;
        }
        out.push(renderList(items)); continue;

/* ---------- inserări Markdown ---------- */
function mdApply(ta, kind, arg) {
  var s = ta.selectionStart, e = ta.selectionEnd, v = ta.value, sel0 = v.slice(s, e), rep = null, ns = s, ne = e;

  function lines(prefix) {
    var ls = v.lastIndexOf('\n', s - 1) + 1, le = v.indexOf('\n', e); if (le < 0) le = v.length;
    var blk = v.slice(ls, le).split('\n').map(function (l, i) { return typeof prefix === 'function' ? prefix(i) + l : prefix + l; }).join('\n');
    ta.setRangeText(blk, ls, le, 'end'); return true;
  }
  if (kind === 'bold') wrap('**', '**', t('md_ph_text')); else if (kind === 'italic') wrap('*', '*', t('md_ph_text'));
  else if (kind === 'h2') { lines('## '); } else if (kind === 'h3') { lines('### '); } else if (kind === 'ul') { lines('- '); } else if (kind === 'ol') { lines(function (i) { return (i + 1) + '. '; }); } else if (kind === 'quote') { lines('> '); }
  else if (kind === 'link') { var u = 'https://'; rep = '[' + (sel0 || t('md_ph_text')) + '](' + u + ')'; ns = s + rep.length - u.length - 1; ne = ns + u.length; }
  else if (kind === 'table') { rep = '\n| ' + t('md_col') + ' 1 | ' + t('md_col') + ' 2 |\n| --- | --- |\n| … | … |\n'; ns = ne = s + rep.length; }
  else if (kind === 'hr') { rep = '\n\n---\n\n'; ns = ne = s + rep.length; }
  else if (kind === 'lesson') { rep = '[' + (sel0 || arg.title) + '](lesson:' + arg.id + ')'; ns = ne = s + rep.length; }
  else if (kind === 'ev') { rep = '{ev:' + arg + '}'; ns = ne = s + rep.length; }

      {id: 'l1', title: ro ? 'Ce spune literatura' : 'What the literature says', body: ro ?
        '## Afirmații și dovezi\n\nMarchează o afirmație cu `{ev:ID}` pentru a afișa nivelul ei de dovezi. De exemplu: afirmația A {ev:ev1} are cel mai solid nivel, afirmația B {ev:ev2} este doar observațională, iar C {ev:ev3} este tradițională.\n\nCitește tabloul complet în secțiunea [Tablou de dovezi](evidence:).' :
        '## Claims and evidence\n\nMark a claim with `{ev:ID}` to show its evidence level. For example: claim A {ev:ev1} has the strongest level, claim B {ev:ev2} is only observational, and C {ev:ev3} is traditional.\n\nRead the full table in the [Evidence table](evidence:) section.',
        questions: [SQ.single(ro ? 'Ce arată un nivel „observațional”?' : 'What does an “observational” level show?', ro ? ['Asocieri, nu cauze', 'Cauze demonstrate', 'Nimic'] : ['Associations, not causes', 'Proven causes', 'Nothing'], 0)]},

    ]}];

    c.levels = [
      {id: 'n1', title: 'Ce găsești pe etichetă', lessons: [
        {id: 'l1', title: 'Unde se află informațiile', body:
'Orice aliment ambalat vândut în Uniunea Europeană poartă pe ambalaj câteva blocuri de informații. Regulile principale se găsesc în **Regulamentul (UE) nr. 1169/2011** privind informarea consumatorilor cu privire la produsele alimentare.\n\n## Patru locuri de căutat\n\n1. **Denumirea produsului** — spune ce este, nu doar cum se numește marca.\n2. **Lista ingredientelor** — de obicei sub cuvântul „Ingrediente”.\n3. **{gl:Declarația nutrițională}** — tabelul cu energie, grăsimi, glucide, proteine și sare.\n4. **Data** — „A se consuma de preferință înainte de” (durabilitate minimală) sau „A se consuma până la” (produse foarte perisabile).\n\n> Pe față pot apărea mențiuni sau imagini de marketing. Ele nu înlocuiesc tabelul nutrițional din spate.\n\n## Un exemplu de tabel\n\n![Declarație nutrițională pentru un produs fictiv, cu valori la 100 g și la porția de 30 g](img:eticheta)\n\nProdusul din imagine este **fictiv**; valorile sunt alese pentru exercițiu. Mai jos revenim la ele în [lecția despre declarația nutrițională](lesson:l2).',
          questions: [
            SQ.single('În ce parte a ambalajului găsești, de regulă, tabelul cu energie, grăsimi, glucide, proteine și sare?', ['Declarația nutrițională', 'Lista ingredientelor', 'Data durabilității minimale', 'Denumirea produsului'], 0, 'Tabelul se numește declarație nutrițională. Lista ingredientelor spune din ce este făcut produsul, nu cât conține din fiecare nutrient.'),

          ]},
        {id: 'l2', title: 'Declarația nutrițională', body:
'Declarația nutrițională obligatorie conține, în această ordine:\n\n- **valoarea energetică** (în kJ și kcal);\n- **grăsimi**, din care **acizi grași saturați**;\n- **glucide**, din care **zaharuri**;\n- **proteine**;\n- **sare**.\n\n{gl:Fibre alimentare} și alte substanțe pot fi adăugate voluntar, cum se vede în exemplul fictiv din lecția anterioară.\n\n## „La 100 g” și „pe porție”\n\nValorile sunt exprimate **la 100 g** (sau la 100 ml pentru lichide). Producătorul poate adăuga și valori **pe porție**. Pentru a compara două produse, folosește coloana „la 100 g”: porțiile declarate diferă de la un producător la altul.\n\nPentru a afla cât consumi efectiv, folosești o regulă de trei simplă:\n\n**cantitate consumată (g) × valoare la 100 g ÷ 100**\n\nExemplu: dacă un produs are 22 g zaharuri la 100 g și mănânci 30 g din el, consumi 30 × 22 ÷ 100 = **6,6 g** de zaharuri.\n\n## Energia: kJ și kcal\n\n| Unitate | Echivalență |\n| --- | --- |\n| 1 kcal | aproximativ 4,184 kJ |\n| 100 kcal | aproximativ 418 kJ |\n\nEnergia se declară în ambele unități; cifrele din kcal sunt cele cu care ești probabil obișnuit.',
          questions: [
            SQ.order('Ordonează elementele declarației nutriționale obligatorii, în ordinea în care apar.', ['Valoarea energetică', 'Grăsimi', 'Glucide', 'Proteine', 'Sare'], 'Ordinea este stabilită de regulament: energie, grăsimi, glucide, proteine, sare.'),
            SQ.fill('Un produs are 22 g zaharuri la 100 g. Dacă mănânci 50 g din el, consumi [[11|11,0|11.0]] g zaharuri.', '50 × 22 ÷ 100 = 11.'),
            SQ.short('Energia se declară în kcal și în ...? (numele unității)', ['kJ', 'kilojouli', 'kilojoul', 'kilojoule'], 'Cealaltă unitate este kilojoulul (kJ).')
          ]},
        {id: 'l3', title: 'Lista ingredientelor și alergenii', body:
'Ingredientele sunt enumerate în **ordine descrescătoare după greutatea** lor la momentul fabricării. Primul ingredient este cel mai prezent în produs; dacă zahărul apare printre primele, produsul conține mult zahăr.\n\nSubstanțele care pot provoca alergii sau intoleranțe sunt evidențiate în lista de ingrediente (de exemplu cu litere îngroșate). Regulamentul enumeră **14 alergeni** care trebuie declarați:\n\n- cereale care conțin gluten, crustacee, ouă, pește, arahide, soia, lapte;\n- fructe cu coajă, țelină, muștar, semințe de susan;\n- dioxid de sulf și sulfiți (peste 10 mg/kg sau 10 mg/l), lupin, moluște.\n\nMențiunile de tip „poate conține urme de…” sunt precauționale și **voluntare**; ele nu sunt armonizate la nivelul Uniunii. Dacă ai o {gl:alergie} diagnosticată, urmează recomandările medicului tău și, la nevoie, contactează producătorul.\n\n## Aditivii\n\nAditivii apar după categoria lor (de exemplu „conservant”) și numele sau numărul E. Prezența unui aditiv autorizat nu înseamnă, prin ea însăși, că un produs este bun sau rău.',
          questions: [
            SQ.multi('Care dintre următoarele sunt alergeni ce trebuie evidențiați în lista de ingrediente în UE?', ['Lapte', 'Ouă', 'Arahide', 'Zahăr', 'Sare'], [0, 1, 2], 'Laptele, ouăle și arahidele sunt pe lista celor 14 alergeni; zahărul și sarea nu sunt alergeni.'),
            SQ.single('Ingredientele sunt enumerate în ordinea...', ['descrescătoare după greutate, la fabricare', 'alfabetică', 'crescătoare după preț', 'aleasă liber de producător'], 0, 'Primul ingredient este cel cu cea mai mare greutate.'),
            SQ.match('Potrivește termenul cu sensul lui.', [['Alergen', 'Substanță care poate declanșa o reacție alergică'], ['Ingredient', 'Substanță folosită la fabricare și prezentă în produsul finit'], ['Aditiv', 'Substanță adăugată cu un scop tehnologic, de exemplu conservarea']])
          ]}
      ]},
      {id: 'n2', title: 'Interpretare și mențiuni', lessons: [
        {id: 'l4', title: 'Sare, zaharuri și fibre', body:
'Ca să judeci o valoare, ajută s-o raportezi la **aportul de referință** pentru un adult mediu, dat în Regulamentul (UE) nr. 1169/2011:\n\n| Element | Aport de referință pe zi |\n| --- | --- |\n| Energie | 8400 kJ / 2000 kcal |\n| Grăsimi | 70 g |\n| din care saturate | 20 g |\n| Glucide | 260 g |\n| din care zaharuri | 90 g |\n| Proteine | 50 g |\n| Sare | 6 g |\n\nAcestea sunt repere pentru etichetare, **nu recomandări personale**. Nevoile reale depind de vârstă, sex, activitate și starea de sănătate.\n\n## Sarea\n\nSarea de pe etichetă este calculată din sodiu: **sare = sodiu × 2,5**. Organizația Mondială a Sănătății recomandă adulților sub 5 g de sare pe zi {ev:ev-sare}.\n\n## Zaharurile\n\nColoana „zaharuri” include și zaharurile din lapte sau din fructe, nu doar pe cele adăugate. OMS recomandă ca zaharurile libere să fie sub 10% din energia zilnică {ev:ev-zahar}.\n\n## Fibrele\n\nUn aport mai mare de fibre alimentare este asociat în studii populaționale cu un risc mai mic de boli cardiovasculare {ev:ev-fibre}. Asocierea nu dovedește, singură, o cauză.\n\nO capcană frecventă este ideea că „natural” înseamnă automat „mai sănătos” {ev:ev-natural}. Tabloul de dovezi al cursului arată cum stau lucrurile.',
          questions: [
            SQ.single('Cum se obține cantitatea de sare din cantitatea de sodiu?', ['sare = sodiu × 2,5', 'sare = sodiu × 1,5', 'sare = sodiu ÷ 2,5', 'Nu se poate calcula'], 0, 'Factorul de conversie folosit pe etichete este 2,5.'),
            SQ.tf('Valorile de referință din tabel sunt recomandări personalizate pentru fiecare persoană.', false, 'Sunt repere pentru un adult mediu, folosite la etichetare.'),
            SQ.single('Ce nivel de dovezi are, în tabloul acestui curs, afirmația că „natural” înseamnă mai sănătos?', ['Fără dovezi', 'Studii controlate', 'Observațional', 'Tradițional'], 0, 'Tabloul o încadrează la „Fără dovezi”.')
          ]},
        {id: 'l5', title: 'Mențiunile de pe față', body:
'Mențiunile nutriționale („fără zahăr”, „bogat în proteine”) sunt reglementate în UE de **Regulamentul (CE) nr. 1924/2006**: o mențiune poate fi folosită doar dacă produsul îndeplinește condiții precise. Câteva exemple (verifică textul în vigoare):\n\n| Mențiune | Condiție, pe scurt |\n| --- | --- |\n| Fără zahăr | cel mult 0,5 g zaharuri la 100 g sau 100 ml |\n| Conținut scăzut de grăsimi | cel mult 3 g grăsimi la 100 g (solide) sau 1,5 g la 100 ml (lichide) |\n| Bogat în proteine | cel puțin 20% din energie provine din proteine |\n| Light / lite | reducere de cel puțin 30% a unui element față de un produs similar, cu precizarea elementului |\n\n## „Fără zahăr” nu înseamnă „fără zahăr adăugat”\n\n„Fără zahăr adăugat” spune că nu s-au adăugat zaharuri, dar produsul poate conține zaharuri naturale (de exemplu din fructe sau lapte). Citește mereu și coloana „din care zaharuri”.\n\n## Utilizări tradiționale\n\nAmbalajele unor produse pe bază de plante evocă utilizări tradiționale, de exemplu ceaiul de mușețel pentru stomac {ev:ev-musetel}. O utilizare tradițională nu este o mențiune nutrițională autorizată și nu are același nivel de dovezi ca rezultatele studiilor controlate.',
          questions: [
            SQ.single('Un produs are 3 g zaharuri la 100 g. Poate purta mențiunea „fără zahăr”?', ['Nu: limita este de cel mult 0,5 g la 100 g', 'Da: 3 g este puțin', 'Da, dacă nu are zahăr adăugat', 'Doar dacă este lichid'], 0, 'Pentru „fără zahăr” se cer cel mult 0,5 g zaharuri la 100 g sau 100 ml.'),
            SQ.fill('Mențiunea „fără zahăr” cere cel mult [[0,5|0.5]] g zaharuri la 100 g.'),
            SQ.tf('„Fără zahăr adăugat” înseamnă întotdeauna că produsul nu conține deloc zaharuri.', false, 'Produsul poate conține zaharuri naturale, de exemplu din fructe sau lapte.')
          ]}
      ]}
    ];
    c.glossary = [
      {id: 'g1', term: 'Declarația nutrițională', def: 'Tabelul obligatoriu de pe ambalaj cu valoarea energetică și cantitățile de grăsimi, glucide, proteine și sare.'},
      {id: 'g2', term: 'Aport de referință', def: 'Valoare orientativă pe zi pentru un adult mediu, folosită la etichetare; nu este o recomandare personală.'},
      {id: 'g3', term: 'Alergen', def: 'Substanță care poate declanșa o reacție alergică; 14 categorii trebuie evidențiate pe etichetă în UE.'},
      {id: 'g4', term: 'Alergie', def: 'Reacție a sistemului imunitar la o substanță în mod normal inofensivă. Diagnosticul îl pune medicul.'},
      {id: 'g5', term: 'Fibre alimentare', def: 'Componente ale alimentelor de origine vegetală care nu sunt digerate în intestinul subțire; declararea lor este voluntară.'},
      {id: 'g6', term: 'Glucide', def: 'Grupa care include zaharurile și amidonul; „din care zaharuri” arată partea de zaharuri.'},
      {id: 'g7', term: 'Sodiu', def: 'Element chimic din sarea de masă; sarea de pe etichetă se calculează înmulțind sodiul cu 2,5.'},
      {id: 'g8', term: 'Porție', def: 'Cantitatea pe care producătorul o propune pentru un consum; poate fi diferită de cea pe care o mănânci.'}
    ];
    c.evidence = [
      {id: 'ev-sare', claim: 'Reducerea aportului de sare scade tensiunea arterială la adulți.', level: 'controlled', sources: 'OMS (2012). Guideline: Sodium intake for adults and children. Geneva: World Health Organization.\nHe FJ, Li J, MacGregor GA (2013). Effect of longer term modest salt reduction on blood pressure: Cochrane systematic review and meta-analysis of randomised trials. BMJ 346:f1325.', note: 'Efect mediu, mai mare la persoanele cu tensiune ridicată.'},
      {id: 'ev-zahar', claim: 'Un aport mare de zaharuri libere este asociat cu un risc mai mare de carii dentare.', level: 'observational', sources: 'OMS (2015). Guideline: Sugars intake for adults and children. Geneva: World Health Organization.', note: 'Asociere observată în studii populaționale; recomandarea de sub 10% din energie se bazează pe ea.'},
      {id: 'ev-fibre', claim: 'Un aport mai mare de fibre alimentare este asociat cu un risc mai mic de boli cardiovasculare.', level: 'observational', sources: 'Reynolds A, et al. (2019). Carbohydrate quality and human health: a series of systematic reviews and meta-analyses. The Lancet 393(10170):434–445.', note: 'Sinteze de studii observaționale; arată asociere, nu cauzalitate.'},
      {id: 'ev-musetel', claim: 'Ceaiul de mușețel este folosit tradițional pentru a calma stomacul.', level: 'traditional', sources: 'Utilizare tradițională documentată în monografii ale autorităților de reglementare pentru plante medicinale (caută „herbal monograph” pe site-ul Agenției Europene a Medicamentelor).', note: 'Nu este o dovadă din studii controlate.'},
      {id: 'ev-natural', claim: 'Un aliment etichetat „natural” este mai sănătos decât unul fără această mențiune.', level: 'none', sources: 'Nu există o definiție generală a mențiunii „natural” pentru toate alimentele; nu există dovezi că ea indică o valoare nutrițională mai bună.', note: 'Compară întotdeauna tabelul nutrițional.'}
    ];
    c.finalTest = {enabled: true, threshold: 70, count: 8, seed: 'fabrica-demo', shuffle: true, reseed: true, includeLessonQuestions: false, bank: [
      SQ.single('Pe ce coloană compari corect două produse diferite?', ['La 100 g', 'Pe porție', 'Pe ambalaj', 'Pe preț'], 0, 'Porțiile diferă de la un producător la altul; la 100 g valorile sunt comparabile.'),
      SQ.single('Cum se obține cantitatea de sare din cantitatea de sodiu?', ['sare = sodiu × 2,5', 'sare = sodiu × 1,5', 'sare = sodiu ÷ 2,5', 'Nu se poate calcula'], 0),
      SQ.tf('Primul ingredient din listă este cel prezent în cea mai mare cantitate.', true, 'Lista este în ordine descrescătoare după greutate.'),
      SQ.multi('Care dintre următoarele sunt elemente obligatorii ale declarației nutriționale?', ['Valoarea energetică', 'Proteine', 'Sare', 'Vitamina C', 'Fibre alimentare'], [0, 1, 2], 'Vitamina C și fibrele pot apărea voluntar.'),
      SQ.fill('Un produs are 14 g grăsimi la 100 g. În 30 g de produs consumi [[4,2|4.2]] g grăsimi.', '30 × 14 ÷ 100 = 4,2.'),
      SQ.fill('1 kcal este aproximativ [[4,184|4.184|4,18|4.18|4,2|4.2]] kJ.'),
      SQ.short('Câți alergeni trebuie declarați în Uniunea Europeană? (număr)', ['14', 'paisprezece', '14 alergeni'], 'Sunt 14 categorii.'),
      SQ.order('Ordonează pașii pentru a evalua un produs.', ['Citești denumirea', 'Verifici ingredientele și alergenii', 'Compari coloana „la 100 g”', 'Calculezi cantitatea pentru porția ta']),
      SQ.match('Potrivește mențiunea cu condiția.', [['Fără zahăr', 'cel mult 0,5 g zaharuri la 100 g'], ['Conținut scăzut de grăsimi', 'cel mult 3 g grăsimi la 100 g (solide)'], ['Bogat în proteine', 'cel puțin 20% din energie din proteine']]),
      SQ.single('Cum este încadrată în tabloul de dovezi afirmația despre ceaiul de mușețel?', ['Tradițional', 'Studii controlate', 'Observațional', 'Fără dovezi'], 0),
      SQ.tf('Mențiunea „poate conține urme de…” este armonizată, obligatorie și identică în toată UE.', false, 'Este precauțională și voluntară.'),
      SQ.short('kJ este o unitate pentru...? (un cuvânt)', ['energie', 'energia', 'valoare energetică'], 'Kilojoulul măsoară energia.')
    ]};
    return c;
  }
};

init();
})();
</script>
